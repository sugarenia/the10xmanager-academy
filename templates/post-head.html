
<meta charset="utf-8">
<script>(function(){var d=document.documentElement;d.classList.add("js");try{if(localStorage.getItem("theme")==="light")d.setAttribute("data-theme","light")}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
%%HEADMETA%%
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&amp;family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1117;}
a{color:#B7D26C;text-decoration:none}a:hover{color:#D6E7A2}
*{box-sizing:border-box}
a,button{transition:color .15s ease,background-color .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease,filter .15s ease}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #B7D26C;outline-offset:3px}
.nav-link:hover{color:#F3F5F8 !important}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 6px 18px rgba(187,153,246,.28)}
.btn-primary:active{transform:translateY(0);box-shadow:none}
.btn-green:hover{box-shadow:0 6px 18px rgba(183,210,108,.28)}
.hl{background:#B7D26C;color:#0D1117;padding:0 6px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-violet{background:#BB99F6}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.foot-link:hover{text-decoration:underline;text-underline-offset:3px}
.back-link:hover{color:#F3F5F8 !important}
.prose a{color:#F3F5F8;text-decoration:underline;text-decoration-color:#B7D26C;text-decoration-thickness:2px;text-underline-offset:4px}
.prose a:hover{color:#B7D26C}
.related-card{transition:border-color .2s ease,transform .2s ease}
.related-card:hover{border-color:#BB99F6 !important;transform:translateY(-3px)}
.related-card:hover .related-title{color:#BB99F6 !important}
.logo-link .rocket{transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
.logo-link:hover .rocket{transform:translate(1px,-3px) rotate(8deg)}
.nav-toggle{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.burger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:4px;width:44px;height:44px;border:1px solid #2A313B;border-radius:6px;cursor:pointer;transition:border-color .15s ease}
.burger:hover{border-color:#BB99F6}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:#F3F5F8;transition:transform .2s ease,opacity .2s ease}
.nav-toggle:focus-visible + .burger{outline:2px solid #B7D26C;outline-offset:3px}
.nav-toggle:checked + .burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.nav-toggle:checked + .burger span:nth-child(2){opacity:0}
.nav-toggle:checked + .burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media (max-width: 640px){
.burger{display:inline-flex !important}
.nav-links{display:none !important;flex-basis:100%;flex-direction:column;align-items:stretch !important;gap:0 !important;font-size:16px !important;padding:4px 0 8px}
.nav-toggle:checked ~ .nav-links{display:flex !important}
.nav-links .nav-link{padding:14px 2px;border-bottom:1px solid #1F242C}
.nav-links .btn-primary{justify-content:center;margin-top:20px;min-height:48px !important}
.logo-link svg{width:240px !important}
.post-head{padding-top:40px !important}
.prose{font-size:17px !important}
.nl-row{flex-wrap:wrap !important}
.nl-row input,.nl-row button{flex:1 1 100% !important}
.pad-box{padding:28px 20px !important}
}

.prose p{margin:0 0 24px}
.prose h2{margin:48px 0 16px;font-family:'DM Mono',monospace;font-weight:500;font-size:26px;line-height:1.3;letter-spacing:-0.04em;color:#F3F5F8}
.prose h3{margin:36px 0 12px;font-family:'DM Mono',monospace;font-weight:500;font-size:21px;line-height:1.35;letter-spacing:-0.03em;color:#F3F5F8}
.prose h4{margin:28px 0 10px;font-size:18px;font-weight:700;line-height:1.4;color:#F3F5F8}
.prose ul,.prose ol{margin:0 0 24px;padding-left:24px}
.prose li+li{margin-top:8px}
.prose li>ul,.prose li>ol{margin:8px 0 0}
.prose strong{color:#F3F5F8}
.prose blockquote{margin:40px 0;padding:4px 0 4px 24px;border-left:3px solid #BB99F6;font-family:'DM Mono',monospace;font-size:20px;font-weight:500;line-height:1.5;letter-spacing:-0.02em;color:#F3F5F8}
.prose blockquote p{margin:0 0 12px}.prose blockquote p:last-child{margin:0}
.prose hr{margin:40px 0;border:0;border-top:1px dashed #2E343E}
.prose figure{margin:32px 0}
.prose img{display:block;width:100%;height:auto;border-radius:12px}
.prose figcaption{margin-top:10px;font-family:'DM Mono',monospace;font-size:13px;color:#6E7684}
.prose table{width:100%;border-collapse:collapse;font-size:16px;margin:0 0 24px;display:block;overflow-x:auto}
.prose td,.prose th{padding:16px 18px;border:1px solid #2A303A;background:#161A20;vertical-align:middle;text-align:left}
.prose .embed{margin:32px 0}
.theme-toggle{display:none;order:2;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid #2A313B;border-radius:6px;background:transparent;color:#F3F5F8;cursor:pointer;transition:border-color .15s ease}
html.js .theme-toggle{display:inline-flex}
.theme-toggle:hover{border-color:#BB99F6}
.theme-toggle .icon-moon{display:none}
html[data-theme="light"] .theme-toggle .icon-sun{display:none}
html[data-theme="light"] .theme-toggle .icon-moon{display:block}
.nav-links{order:1;margin-left:auto}
html[data-theme="light"] .burger span{background:#15171C}
@media (max-width: 640px){.theme-toggle{order:0;margin-left:auto}.nav-links{order:3}nav{column-gap:10px !important}.logo-link svg{width:200px !important}}
</style>
<style>html{scroll-behavior:smooth;background:#0D1117}</style>
