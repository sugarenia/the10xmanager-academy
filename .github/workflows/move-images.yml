name: Move post images off Wix (one-off)
on:
  push:
    paths: [".github/workflows/move-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/move-images.mjs
      - name: Commit the images and remove this one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/move-images.yml tools/move-images.mjs
          git add -A
          git commit -m "Host post images on the site instead of Wix"
          git push
